spring:
  application:
    name: inventory-backend

  config:
    import:
      - "optional:classpath:application-local.yml"
      - "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Phnom_Penh

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: ${JWT_EXPIRATION:3600000}       # 1 hour in ms
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}    # 7 days in ms

  cors:
    allowed-origins: ${CORS_ORIGINS:${CROS_ORIGINS:http://localhost:3000,https://inventory-limpeav.vercel.app,https://*-limpeav.vercel.app,https://inventory-rho-drab.vercel.app,https://*.vercel.app,*}}

  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-email: ${APP_ADMIN_EMAIL:admin@inventory.com}
    admin-password: ${APP_ADMIN_PASSWORD:}
    admin-fullname: ${APP_ADMIN_FULLNAME:System Administrator}

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

  mail:
    from: ${MAIL_FROM:noreply@inventory.com}
    sender-name: ${MAIL_SENDER_NAME:Inventory Management}

  reset-token:
    expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:15}

logging:
  level:
    com.inventory: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
